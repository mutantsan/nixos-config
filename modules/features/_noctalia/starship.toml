# Generated by Noctalia from ~/dotfiles/starship/.config/starship.toml with the
# colours swapped for the palette; keep the two layouts in sync.

# Powerline glyphs from the BMP private-use area are written as \uXXXX escapes
# so they survive copy-paste through tools that strip them. Needs a Nerd Font.
#    left round cap    segment separator    right round cap

format = """
[](fg:{{colors.tertiary.default.hex}})\
$os$username[@](bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}})$hostname\
[](bg:{{colors.terminal_normal_blue.default.hex}} fg:{{colors.tertiary.default.hex}})\
$directory\
[](bg:{{colors.secondary.default.hex}} fg:{{colors.terminal_normal_blue.default.hex}})\
$git_branch$git_commit$git_state$git_metrics$git_status\
[](bg:{{colors.primary.default.hex}} fg:{{colors.secondary.default.hex}})\
$package$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam\
$golang$guix_shell$haskell$haxe$helm$java$julia$kotlin$gradle$lua$nim$nodejs\
$ocaml$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust\
$scala$solidity$swift$terraform$typst$vlang$vagrant$zig\
[](bg:{{colors.on_surface_variant.default.hex}} fg:{{colors.primary.default.hex}})\
$cmd_duration\
[](fg:{{colors.on_surface_variant.default.hex}})\
$line_break\
$character
"""

# EXCLUDED $
# ==========
# to add later if I need them lmao
# localip, shlvl, singularity, kubernetes
# vcsh, fossil_branch, fossil_branch_metrics, hg_branch, pijul_channel, docker_context
# buf, nix_shell, conda, meson, spack
# memory_usage
# aws, gcloud, openstack, azure
# direnv, env_var, crytal, custom, sudo
# jobs, status, container, shell

# GIT
# ===

[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = "󰘬 "
style = "fg:{{colors.on_secondary.default.hex}} bg:{{colors.secondary.default.hex}}"

[git_commit]

[git_state]

[git_metrics]

[git_status]
format = "([$all_status$ahead_behind ]($style))"
style = "fg:{{colors.on_secondary.default.hex}} bg:{{colors.secondary.default.hex}}"

# LANGUAGES
# =========

[package]
symbol = '󰏗 '
format = '[ $symbol($version )]($style)'
style = "fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"

[lua]
symbol = '󰢱 '
format = '[ $symbol($version )]($style)'
style = "fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"

[nodejs]
symbol = '󰎙 '
format = '[ $symbol($version )]($style)'
style = "fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"

[python]
symbol = '󰌠 '
format = "[ $symbol($version )]($style)"
style = "fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"

# MISC
# ====

[hostname]
ssh_only = false
style = "fg:{{colors.on_tertiary.default.hex}} bg:{{colors.tertiary.default.hex}}"
format = "[$ssh_symbol$hostname ]($style)"
ssh_symbol = " " # globe

[os]
style = "fg:{{colors.on_tertiary.default.hex}} bg:{{colors.tertiary.default.hex}}"
disabled = false

[os.symbols]
Arch = " "
Macos = " "
NixOS = " "

[shell]
disabled = false

[username]
show_always = true
format = '[$user]($style)'
style_user = "fg:{{colors.on_tertiary.default.hex}} bg:{{colors.tertiary.default.hex}}"

[directory]
style = "fg:{{colors.terminal_background.default.hex}} bg:{{colors.terminal_normal_blue.default.hex}}"
read_only = " " # lock
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)"
read_only_style = "fg:{{colors.terminal_background.default.hex}} bold bg:{{colors.terminal_normal_blue.default.hex}}"

[sudo]
disabled = false
symbol = " " # key
style = "fg:{{colors.surface.default.hex}} bg:{{colors.on_surface_variant.default.hex}}"
format = "[ $symbol]($style)"

[cmd_duration]
format = "[ 󰔚 $duration ]($style)"
style = "fg:{{colors.surface.default.hex}} bg:{{colors.on_surface_variant.default.hex}}"

[character]
success_symbol = "[ 󱞩](bold green)"
error_symbol = "[ 󱞩](bold red)"
vimcmd_symbol = "[  󱞩](bold green)"
